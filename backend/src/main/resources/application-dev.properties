# ==============================================================================
# MoTA Scholarship Backend - Development Profile (MySQL)
# Used when running: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ==============================================================================

# MySQL is used even in dev
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mota_scholarship}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Nidhi@21}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL for debugging in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway enabled in dev
spring.flyway.enabled=true

# CORS - allow local frontend
app.frontend.url=http://localhost:5173
app.mock.integrations-enabled=true
app.demo-data.enabled=true
