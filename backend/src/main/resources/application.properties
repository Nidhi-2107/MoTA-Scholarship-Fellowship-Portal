# ==============================================================================
# MoTA Scholarship & Fellowship Operating System - Core Properties
# ==============================================================================
spring.application.name=mota-scholarship-platform

# Server Configuration (Render dynamically assigns PORT)
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (MySQL as the ONLY database)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mota_scholarship}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Nidhi@21}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Validate schema against Flyway migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# File Upload Constraints (Strict 5MB limit enforced)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Local File Storage Configuration (Filesystem uploads)
app.storage.file-path=${FILE_STORAGE_PATH:uploads}

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}
app.jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRATION:${REFRESH_TOKEN_EXPIRATION_MS:604800000}}

# OpenAI Backend Configuration (Backend-only, graceful fallback when key is empty)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Tesseract Native Path (Configurable for Windows and Linux/Render)
app.tesseract.path=${TESSERACT_PATH:tesseract}

# Frontend CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Integrations Configuration
app.mock.integrations-enabled=${MOCK_INTEGRATIONS:true}
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
