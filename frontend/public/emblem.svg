    <path d="M62 18 C67 16 72 19 74 24 C76 28 75 33 72 37 C74 39 75 43 73 46 C71 49 67 51 63 51 L60 50 C62 46 63 42 62 38 C64 36 65 32 64 28 C63 24 62 21 62 18 Z"/>

