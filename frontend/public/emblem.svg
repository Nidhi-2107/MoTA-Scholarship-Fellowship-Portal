    <circle cx="50" cy="70" r="8" fill="none" stroke="#0b3866" stroke-width="2"/>
    <circle cx="50" cy="70" r="2" fill="#0b3866"/>
    <!-- Spokes of Chakra -->
    <line x1="50" y1="62" x2="50" y2="78" stroke="#0b3866" stroke-width="1"/>
    <line x1="42" y1="70" x2="58" y2="70" stroke="#0b3866" stroke-width="1"/>
    <line x1="44.3" y1="64.3" x2="55.7" y2="75.7" stroke="#0b3866" stroke-width="1"/>
    <line x1="44.3" y1="75.7" x2="55.7" y2="64.3" stroke="#0b3866" stroke-width="1"/>

    <!-- Galloping Horse (Left) & Bull (Right) silhouette indicators -->
    <path d="M26 66 C28 65 31 66 33 68 C34 71 33 74 30 75 C27 75 25 72 26 66 Z"/>
    <path d="M74 66 C72 65 69 66 67 68 C66 71 67 74 70 75 C73 75 75 72 74 66 Z"/>

