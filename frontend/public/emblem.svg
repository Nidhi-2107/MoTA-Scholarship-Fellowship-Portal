    <path d="M22 84 C26 94 36 98 50 98 C64 98 74 94 78 84 C72 86 62 88 50 88 C38 88 28 86 22 84 Z"/>
    <path d="M30 94 C36 102 44 104 50 104 C56 104 64 102 70 94 C64 96 58 97 50 97 C42 97 36 96 30 94 Z"/>

