    <path d="M50 8 C44 8 40 12 39 17 C37 18 36 21 36 24 C36 28 38 31 40 33 C39 36 39 39 41 42 C42 45 45 47 48 48 L48 56 L52 56 L52 48 C55 47 58 45 59 42 C61 39 61 36 60 33 C62 31 64 28 64 24 C64 21 63 18 61 17 C60 12 56 8 50 8 Z M45 22 C46 22 47 23 47 24 C47 25 46 26 45 26 C44 26 43 25 43 24 C43 23 44 22 45 22 Z M55 22 C56 22 57 23 57 24 C57 25 56 26 55 26 C54 26 53 25 53 24 C53 23 54 22 55 22 Z M50 32 C47 32 46 35 46 37 C48 38 52 38 54 37 C54 35 53 32 50 32 Z"/>
    
    <!-- Left Lion Profile -->
    <path d="M38 18 C33 16 28 19 26 24 C24 28 25 33 28 37 C26 39 25 43 27 46 C29 49 33 51 37 51 L40 50 C38 46 37 42 38 38 C36 36 35 32 36 28 C37 24 38 21 38 18 Z"/>
    
